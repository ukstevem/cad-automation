services:
  api:
    build: .
    container_name: cad-automation-api
    ports:
      - "8000:8000"
    volumes:
      # Bind mount for live code editing
      - ./app:/app/app
      # Tests and config
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      # Frontend
      - ./frontend:/app/frontend
      # Persistent volumes for data
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      # uvicorn --reload uses watchfiles, whose inotify events don't fire across
      # the Windows Docker Desktop bind mount — backend edits were silently NOT
      # picked up until a manual restart. Force polling so --reload works.
      - WATCHFILES_FORCE_POLLING=true
      - UPLOAD_DIR=/app/uploads
      - TEMP_DIR=/app/temp
      - OUTPUT_DIR=/app/outputs
      - ANALYSIS_OUTPUT_DIR=/app/outputs/analysis
      - STL_OUTPUT_DIR=/app/outputs/stl
      - NESTING_BASE_URL=http://10.0.0.74:8001
    restart: unless-stopped
    networks:
      - cad-network

networks:
  cad-network:
    driver: bridge
