services:
  api:
    build: .
    container_name: cad-automation-api
    # Run WITHOUT uvicorn --reload: on the Windows Docker bind mount the
    # watchfiles reloader either doesn't detect edits (inotify) or, with
    # polling, fires phantom restarts and crashes (os error 5) — each restart
    # kills in-flight analysis/classify/STL subprocesses (symptom: "stuck
    # detecting"). Stable single process; restart manually after backend edits.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # Bind mount for live code editing
      - ./app:/app/app
      # Tests and config
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      # Headless CLIs (fit_multiview, capture helpers) - not COPYed by the Dockerfile,
      # so they are mounted to run inside the container where OpenCV lives.
      - ./tools:/app/tools
      # Frontend
      - ./frontend:/app/frontend
      # Persistent volumes for data
      - ./uploads:/app/uploads
      - ./temp:/app/temp
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_DIR=/app/uploads
      - TEMP_DIR=/app/temp
      - OUTPUT_DIR=/app/outputs
      - ANALYSIS_OUTPUT_DIR=/app/outputs/analysis
      - STL_OUTPUT_DIR=/app/outputs/stl
      - NESTING_BASE_URL=http://10.0.0.74:8001
    restart: unless-stopped
    networks:
      - cad-network

networks:
  cad-network:
    driver: bridge
